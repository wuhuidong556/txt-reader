<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>TXT 朗读器</title>
<link rel="stylesheet" href="/panel/style.css?token={{TOKEN}}">
</head>
<body>
<div id="offline" class="offline hidden"><span id="offline-msg"></span></div>

<header>
  <div class="brand">TXT 朗读器<span class="sub">听书 · 边合成边播</span></div>
  <div class="hdr-right">
    <span id="engine-badge" class="badge">引擎检测中…</span>
    <span id="cache-badge" class="badge ghost">缓存 0 MB</span>
    <button id="btn-translate" class="btn" title="用 DeepSeek 按高考难度改写成英文">译成英文</button>
    <button id="btn-import" class="btn primary">导入 TXT</button>
  </div>
</header>

<main>
  <aside>
    <section class="pane">
      <h3>书库 <span id="book-count" class="tiny"></span></h3>
      <ul id="book-list" class="book-list"></ul>
    </section>
    <section class="pane">
      <h3>docx 仓库 <span id="docx-count" class="tiny"></span>
        <span class="pane-acts">
          <button id="btn-docx-dir" class="mini" title="在资源管理器里打开仓库目录">📂</button>
          <button id="btn-docx-refresh" class="mini" title="刷新列表">⟳</button>
        </span>
      </h3>
      <ul id="docx-list" class="book-list docx-list"></ul>
    </section>
    <section class="pane grow">
      <h3>目录 <span id="chap-book" class="tiny"></span></h3>
      <ul id="chap-list" class="chap-list"></ul>
    </section>
  </aside>

  <section class="reader">
    <div class="reader-head">
      <div id="book-title" class="title">还没有打开的书</div>
      <div class="meta-line">
        <span id="book-meta" class="meta">先导入一个 TXT 文件吧</span>
        <label class="enc">编码
          <select id="sel-enc" title="自动识别不准时，手动指定重读">
            <option value="auto">自动</option>
            <option value="utf-8">UTF-8</option>
            <option value="gb18030">GB18030 / GBK</option>
            <option value="utf-16">UTF-16</option>
            <option value="big5">Big5（繁体）</option>
          </select>
        </label>
      </div>
    </div>
    <div id="text" class="text"></div>
    <div id="toast" class="toast hidden"></div>
  </section>
</main>

<footer>
  <div class="ctrl">
    <button id="btn-prev" class="btn icon" title="上一段">⏮</button>
    <button id="btn-play" class="btn play" title="播放 / 暂停">▶</button>
    <button id="btn-next" class="btn icon" title="下一段">⏭</button>
    <span id="pos" class="pos">— / —</span>
  </div>
  <div class="ctrl">
    <label>音色
      <select id="sel-voice"></select>
    </label>
    <span id="lang-switch" class="lang-switch hidden" title="中英对照书：这一段念中文还是念英文">
      <button id="lang-zh" type="button" class="lang-btn on">中文</button>
      <button id="lang-en" type="button" class="lang-btn">English</button>
    </span>
    <label class="vol">音量
      <input id="rng-vol" type="range" min="0" max="100" value="100" step="5" title="音量">
      <span id="vol-num" class="tiny">100%</span>
    </label>
    <label>语速
      <select id="sel-rate">
        <option value="-30%">很慢</option>
        <option value="-15%">慢</option>
        <option value="+0%" selected>正常</option>
        <option value="+15%">快</option>
        <option value="+30%">很快</option>
        <option value="+50%">极快</option>
      </select>
    </label>
  </div>
  <div class="ctrl">
    <span id="status" class="status">就绪</span>
    <button id="btn-export" class="btn">导出整本 mp3</button>
  </div>
</footer>

<div id="tr-modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <b>译成英文 · 按高考难度改写</b>
      <button id="tr-close" class="btn ghost icon" title="关闭">✕</button>
    </div>
    <div class="modal-body">
      <div class="tr-row">
        <span class="tr-label">难度</span>
        <select id="tr-level" class="tr-select">
          <option value="1">1 · 90 分以下（短句、基础词）</option>
          <option value="2" selected>2 · 90–105（高考核心词）</option>
          <option value="3">3 · 105–120（部分四级词）</option>
          <option value="4">4 · 120–135（四六级词、复杂句）</option>
        </select>
        <span id="tr-words" class="tiny"></span>
      </div>
      <div class="tr-row">
        <span class="tr-label">产物</span>
        <div class="tr-outs">
          <label class="chk" title="中英段落对照，输出 txt + docx"><input type="checkbox" id="tr-out-bilingual" checked> 中英对照</label>
          <label class="chk" title="只要英文，输出 txt + docx"><input type="checkbox" id="tr-out-endoc" checked> 纯英文</label>
          <label class="chk" title="英文朗读 mp3"><input type="checkbox" id="tr-out-mp3en" checked> 英文音频</label>
          <label class="chk" title="原文中文朗读 mp3（不调用 DeepSeek）"><input type="checkbox" id="tr-out-mp3zh" checked> 中文音频</label>
        </div>
        <button id="tr-only-en" type="button" class="btn ghost tr-quick">只要英文</button>
        <button id="tr-only-zh" type="button" class="btn ghost tr-quick">只要中文</button>
      </div>
      <div id="tr-out-hint" class="tiny"></div>
      <div class="tr-row">
        <span class="tr-label">收尾</span>
        <label class="chk" title="译完把生成的「中英对照 / 纯英文」txt 直接收进书库，省得再手动导入"><input type="checkbox" id="tr-auto-import" checked> 自动导入书库</label>
        <span class="tiny" id="tr-import-hint" style="opacity:.62"></span>
      </div>
      <div class="tr-bar"><div id="tr-bar-fill"></div></div>
      <div id="tr-status" class="tiny">就绪</div>
      <div id="tr-files" class="tr-files"></div>
      <details class="tr-adv">
        <summary>高级设置（功能开关 / 难度参数，可调）</summary>
        <label class="chk"><input type="checkbox" id="tr-enabled" checked> 启用「译成英文」功能</label>
        <div id="tr-cfg-list" class="tr-cfg"></div>
        <button id="tr-cfg-save" class="btn">保存参数</button>
      </details>
    </div>
    <div class="modal-foot">
      <button id="tr-cancel" class="btn ghost hidden">取消任务</button>
      <button id="tr-start" class="btn primary">开始翻译</button>
    </div>
  </div>
</div>

<audio id="audio" preload="auto"></audio>
<script>window.__TOKEN__ = "{{TOKEN}}"; window.__BUILD__ = "{{BUILD}}";</script>
<script src="/panel/app.js?token={{TOKEN}}"></script>
</body>
</html>
